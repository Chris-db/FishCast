<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#edf6f9" />
  <meta name="description" content="Free fishing-time ratings for any spot: solunar periods, pressure trend, tides, and weather scored into six time blocks." />
  <title>FishCast — when to fish</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700;8..144,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FishCast" />
  <!-- Analytics: create a free account at goatcounter.com, then replace
       YOURCODE below and remove this comment block's wrapper.
  <script data-goatcounter="https://YOURCODE.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  -->
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand-row">
        <span class="wordmark">FishCast</span>
      </div>
      <button id="spot-btn" type="button" class="spot-btn" aria-haspopup="dialog">
        <span class="spot-btn-text">
          <span id="spot-name">—</span>
          <span id="spot-region" class="spot-btn-region"></span>
        </span>
        <svg class="chev" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <nav id="mode-control" class="seg" aria-label="Fishing mode"></nav>
    <nav id="day-tabs" class="tabs" aria-label="Day"></nav>

    <section id="hero" class="hero" hidden></section>

    <div id="dayshape" class="dayshape" aria-hidden="true" hidden></div>

    <p id="summary" class="summary"></p>

    <section id="banner" class="banner" hidden>
      <strong class="banner-title"></strong>
      <span class="banner-text"></span>
    </section>

    <ul id="blocks" class="blocks"></ul>

    <p id="notice" class="notice" hidden></p>

    <footer class="foot">
      Weather &amp; marine data: Open-Meteo · sun, moon &amp; solunar computed locally ·
      tide from modelled sea level — verify against official tables before launching.
      <a class="foot-link" href="mailto:zephyerrl@gmail.com?subject=FishCast%20feedback">Feedback</a>
    </footer>
  </div>

  <nav class="tabbar" aria-label="App">
    <button type="button" class="tab-item" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15q3-4 6-1t6-1 6 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 20q3-4 6-1t6-1 6 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/><circle cx="12" cy="6" r="2.5" fill="currentColor"/></svg>
      <span>Forecast</span>
    </button>
    <button id="tab-spots" type="button" class="tab-item" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg>
      <span>Spots</span>
    </button>
    <button id="share-btn" type="button" class="tab-item" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" stroke-width="2"/></svg>
      <span>Share</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="spot-sheet" class="sheet" aria-label="Spots and settings">
    <div class="sheet-body">
      <div class="sheet-head">
        <h2>Spots</h2>
        <button id="sheet-close" type="button" class="btn btn-quiet" aria-label="Close">✕</button>
      </div>

      <ul id="spot-list" class="spot-list"></ul>

      <label class="field">
        <span class="field-label">Add a spot</span>
        <input id="spot-search" type="search" placeholder="Search any place worldwide…" autocomplete="off" />
      </label>
      <ul id="search-results" class="spot-list"></ul>

      <div id="facing-row" class="field" hidden>
        <label class="field-label" for="facing-select">Shore faces (for wind direction)</label>
        <select id="facing-select">
          <option value="">Not set</option>
          <option value="0">North</option>
          <option value="45">North-east</option>
          <option value="90">East</option>
          <option value="135">South-east</option>
          <option value="180">South</option>
          <option value="225">South-west</option>
          <option value="270">West</option>
          <option value="315">North-west</option>
        </select>
      </div>

      <div class="field">
        <span class="field-label">Units</span>
        <div id="units-control" class="seg">
          <button type="button" class="seg-btn" data-units="metric">Metric</button>
          <button type="button" class="seg-btn" data-units="imperial">Imperial</button>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
